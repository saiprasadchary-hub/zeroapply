name: ZeroApply Desktop Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['audits/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: zeroapply-desktop-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=1.0.$((1000 + RUN_NUMBER))" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-latest
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version
      - run: npm run verify
      - run: npm run test:updates
      - name: Build signed Windows installer
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: node scripts/buildAll.cjs --signed
      - name: Build signed and notarized macOS installers
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          CSC_LINK: ${{ secrets.MAC_SIGN_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_SIGN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          node scripts/buildAll.cjs --signed
      - name: Build unsigned review installers
        if: github.event_name == 'pull_request'
        run: node scripts/buildAll.cjs
      - name: Verify Windows packaged app and AI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'release_build/win-unpacked/ZeroApply.exe').Path
          foreach ($argument in @('--smoke-test', '--verify-bundled-model')) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Packaged verification failed: $argument" }
          }
      - name: Verify macOS packaged app and AI
        if: runner.os == 'macOS'
        run: |
          app=$(find release_build -maxdepth 2 -name ZeroApply.app -print -quit)
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
          fi
          "$app/Contents/MacOS/ZeroApply" --smoke-test
          "$app/Contents/MacOS/ZeroApply" --verify-bundled-model
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroApply-${{ matrix.label }}
          path: |
            release_build/*.exe
            release_build/*.dmg
            release_build/*.zip
            release_build/*.blockmap
            release_build/latest*.yml
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Merge Intel and Apple Silicon update feeds
        run: python3 scripts/merge-mac-update-feeds.py installers
      - name: Publish all installers and update feeds together
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" --target "$COMMIT" --draft --title "ZeroApply $VERSION" --generate-notes
          find installers -type f -print0 | xargs -0 gh release upload "$tag" --clobber
          gh release edit "$tag" --draft=false --latest
